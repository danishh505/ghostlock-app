name: Build & Release GhostLock

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build Extractor
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http

      - name: Generate Kernel Profile from boot.img
        run: |
          # 1. Jalankan ekstraktor (path output sudah benar: build/extract/release/)
          ./tools/extract_rs/build/extract/release/ghostlock-extract \
            firmware/boot.img \
            --format conf \
            --out generated-profile.conf

          # 2. Salin ke direktori assets dengan nama persis uname -r device
          PROFILE_NAME="5.10.237-android12-9-00014-gf82f7360927e-ab1411995.conf"
          cp generated-profile.conf "app/src/main/assets/kernel_profiles/$PROFILE_NAME"

          # 3. Daftarkan ke index.conf (format HOCON: {release, file})
          # Cek dulu apakah entri sudah ada, jika belum tambahkan
          if ! grep -q "$PROFILE_NAME" app/src/main/assets/kernel_profiles/index.conf; then
            echo "  { release = \"$PROFILE_NAME\", file = \"$PROFILE_NAME\" }," >> app/src/main/assets/kernel_profiles/index.conf
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          # Path task Gradle yang benar: :app:assembleRelease
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          # Path output APK yang benar: app/build/outputs/apk/release/
          mv app/build/outputs/apk/release/*.apk GhostLock-release.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_number }}
          name: GhostLock Release ${{ github.run_number }}
          files: GhostLock-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
