name: Build & Release GhostLock

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      # ── 1. Bangun extractor (host) ──────────────────────────────────
      - name: Build Extractor
        working-directory: tools/extract_rs
        run: cargo build --release --features http

      # ── 2. Generate profil kernel dari boot.img ─────────────────────
      - name: Generate Custom Kernel Profile
        run: |
          set -e
          PROFILE_NAME="5.10.237-android12-9-00014-gf82f7360927e-ab1411995.conf"
          PROFILE_PATH="app/src/main/assets/kernel_profiles/$PROFILE_NAME"

          # Jalankan extractor (path sudah terverifikasi)
          ./build/extract/release/ghostlock-extract \
            firmware/boot.img \
            --format conf \
            --out generated-profile.conf

          # Salin ke direktori assets
          cp generated-profile.conf "$PROFILE_PATH"

          # Daftarkan ke index.conf: sisipkan sebelum baris ']' penutup
          if ! grep -qF "$PROFILE_NAME" app/src/main/assets/kernel_profiles/index.conf; then
            sed -i "/^[[:space:]]*]/i\\  { release = \"$PROFILE_NAME\", file = \"$PROFILE_NAME\" }" \
              app/src/main/assets/kernel_profiles/index.conf
          fi

          echo "✅ Profil $PROFILE_NAME berhasil didaftarkan."

      # ── 3. Setup Gradle ────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 4. Siapkan ONDK (NDK + Rust toolchain) ─────────────────────
      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust Toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      # ── 5. Build native binary Ghostlock ───────────────────────────
      - name: Build Ghostlock Native Binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make -C src ghostlock
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all build/native/ghostlock || true

      # ── 6. Build APK Release ───────────────────────────────────────
      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          ./gradlew :app:assembleRelease --no-daemon

      # ── 7. Rename & Upload ke GitHub Releases ─────────────────────
      - name: Rename APK
        run: mv build/app/outputs/apk/release/*.apk GhostLock-release.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: GhostLock Release ${{ github.run_number }}
          files: GhostLock-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
